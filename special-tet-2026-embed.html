const ABBR={Telugu:"TE",Hindi:"HI",Kannada:"KN",Odia:"OD",Tamil:"TA",Urdu:"UR",Sanskrit:"SA",English:"EN"};
const state={g:"all",s:"all",q:""};

R.getElementById("stats").innerHTML=[
  [KEYS.length,"Key PDFs"],[GROUPS.length,"Paper groups"],[new Set(KEYS.map(k=>k[2])).size,"Mediums"],["13–15","Oct exam days"]
].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
const tick=KEYS.map(k=>`<span>${k[1]} <em>${k[4]!=="—"?k[4]:""}</em></span>`).join("");
R.getElementById("ticker").innerHTML=tick+tick;

function chip(label,val,key,color){
  const b=document.createElement("button");b.type="button";b.className="chip";b.id=`chip-${key}-${val}`;
  b.style.setProperty("--c",color||"var(--gold)");
  b.innerHTML=(color?"<i></i>":"")+label;
  b.setAttribute("aria-pressed",state[key]===val);
  b.onclick=()=>{state[key]=val;render();syncChips()};
  return b;
}
const gc=R.getElementById("groupChips"),sc=R.getElementById("shiftChips");
gc.append(chip("All papers","all","g"));GROUPS.forEach(g=>gc.append(chip(g.title,g.id,"g",g.c)));
[["All shifts","all"],["Shift 1","S1"],["Shift 2","S2"]].forEach(([l,v])=>sc.append(chip(l,v,"s")));
function syncChips(){R.querySelectorAll(".chip").forEach(c=>{const p=c.id.split("-");c.setAttribute("aria-pressed",state[p[1]]===p[2])})}
R.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render()});


function render(){
  const main=R.getElementById("main");
  main.innerHTML="";let n=0,shown=0;
  GROUPS.forEach(g=>{
    if(state.g!=="all"&&state.g!==g.id)return;
    const items=KEYS.filter(k=>k[0]===g.id&&(state.s==="all"||k[4]===state.s)&&
      (!state.q||`${k[1]} ${k[2]} ${k[3]} ${k[4]} ${g.title} ${g.code}`.toLowerCase().includes(state.q)));
    if(!items.length)return;
    const sec=document.createElement("section");sec.className="group";sec.style.setProperty("--c",g.c);
    sec.innerHTML=`<div class="ghead"><h2><small>${g.code}</small>${g.title}</h2><p>${g.sub}</p><span class="count">${items.length} key${items.length>1?"s":""}</span></div><div class="grid"></div>`;
    const grid=sec.querySelector(".grid");
    items.forEach(k=>{
      const a=document.createElement("a");a.className="key";a.href=BASE+k[5];a.target="_blank";a.rel="noopener";
      a.style.setProperty("--c",g.c);a.style.setProperty("--i",n++);
      a.setAttribute("aria-label",`Open ${k[1]} ${k[3]} ${k[4]} initial key PDF`);
      a.innerHTML=`<span class="badge">${ABBR[k[2]]||"··"}</span><span class="kname">${k[1]}</span>
        <span class="kmeta">${k[3]?`<span>${k[3]}</span>`:""}<span class="sh">${k[4]==="—"?"Set 1":k[4].replace("S","Shift ")}</span><span>PDF</span></span><span class="arrow" aria-hidden="true">→</span>`;
      a.addEventListener("pointerdown",e=>{const r=a.getBoundingClientRect(),d=Math.max(r.width,r.height);
        const s=document.createElement("span");s.className="ripple";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
        a.append(s);setTimeout(()=>s.remove(),700)});
      a.addEventListener("pointermove",e=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const r=a.getBoundingClientRect();
        const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;a.style.transform=`translateY(-4px) perspective(600px) rotateY(${x*8}deg) rotateX(${-y*8}deg)`});
      a.addEventListener("pointerleave",()=>a.style.transform="");
      grid.append(a);
    });
    main.append(sec);shown++;
    if(AD_AFTER[shown]){const s=document.createElement("slot");s.name=AD_AFTER[shown];main.append(s)}
  });
  if(!n)main.innerHTML=`<div class="empty">No key matches that search. Try a medium like “Telugu” or clear the filters.</div>`;
}
render();

// Header sparks: dust drifting through the projector light
(()=>{
  const cv=R.getElementById("sparks"),cx=cv.getContext("2d");let W,H,P=[];
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=cv.width=r.width*d;H=cv.height=r.height*d;
    P=Array.from({length:Math.round(r.width/8)},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.7+.3)*d,v:(Math.random()*.35+.08)*d,h:Math.random()<.6?"255,201,74":"244,239,226",o:Math.random()*.7+.2}))}
  function frame(){cx.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.x+=Math.sin(p.y/60)*.3;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle=`rgba(${p.h},${p.o})`;cx.fill()});if(!reduce)requestAnimationFrame(frame)}
  size();addEventListener("resize",size);frame();
})();
  }catch(err){console.error("Special TET keys:",err);}
})();
